#
# Build/test extension binaries via DuckDB extension-ci-tools.
# Native desktop platforms (macOS / Linux / Windows). Wasm deferred — see ROADMAP.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      # DuckDB release used to compile/test. Aligns with extension-template-c.
      # Makefile TARGET_DUCKDB_VERSION stays v1.2.0 (stable C_STRUCT / V1 entrypoint).
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: healthkit_export
      extra_toolchains: python3
      # Health app export.zip is a portable file — native OS builds only.
      # Wasm: large exports + bind-time buffering (ROADMAP).
      # osx_amd64: community extensions no longer built for this platform from DuckDB 2.0.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;osx_amd64"
