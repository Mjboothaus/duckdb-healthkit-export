[project]
name = "healthkit-store"
version = "0.3.0"
description = "Local DuckDB health store and walk helpers (companion to duckdb-healthkit-export)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "mjboothaus" }]
keywords = ["duckdb", "health", "gps", "fitness", "local-first"]
dependencies = [
    "duckdb>=1.5.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
# Folium maps / HTML exports (library helpers — preferred over marimo for v0.1)
maps = [
    "folium>=0.20.0",
]
# Marimo apps — EXPERIMENTAL; not fully verified. Prefer scripts + maps helpers.
notebooks = [
    "marimo>=0.24.2",
    "altair>=5.4.0",
    "polars>=1.0.0",
    "folium>=0.20.0",
]
# Extension golden tests / fixture compare
dev = [
    "pytest>=8.0",
    "healthkit-to-sqlite>=1.0.1",
]
all = [
    "folium>=0.20.0",
    "marimo>=0.24.2",
    "altair>=5.4.0",
    "polars>=1.0.0",
    "pytest>=8.0",
    "healthkit-to-sqlite>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/Mjboothaus/duckdb-healthkit-export"
Repository = "https://github.com/Mjboothaus/duckdb-healthkit-export"
Documentation = "https://github.com/Mjboothaus/duckdb-healthkit-export/blob/main/docs/PYTHON_PACKAGE.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/healthkit_store"]

[tool.hatch.build.targets.sdist]
include = [
    "python/healthkit_store",
    "scripts",
    "notebooks",
    "docs",
    "VERSION",
    "README.md",
    "LICENSE",
]

[tool.uv]
package = true
prerelease = "allow"
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "healthkit-to-sqlite>=1.0.1",
    "folium>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
